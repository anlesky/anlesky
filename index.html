            outline: none;

        input::placeholder, textarea::placeholder {

        button {

            padding: 13px;

            border: none; 
            color: var(--button-text); 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
            margin-top: 8px;

        }
        button:active {
            opacity: 0.85;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>

### 2. 🐍 Python 后端适配逻辑（基于 python-telegram-bot）

既然前端回传的数据中已经直接包含了 `target_channel` 和 `target_group` 的真实数字 ID，后端**不再需要做映射表**，直接引用变量发送即可：

```python
import json
from telegram import Update, InlineKeyboardButton, InlineKeyboardMarkup
from telegram.ext import Application, MessageHandler, CallbackQueryHandler, filters, ContextTypes

async def handle_webapp_data(update: Update, context: ContextTypes.DEFAULT_TYPE):
    raw_data = update.message.web_app_data.data
    data = json.loads(raw_data)
    
    teacher = data.get("teacher_name")
    score = data.get("score")
    comment = data.get("comment")
    
    # 直接拿到真实的数字群组/频道 ID 字符串
    target_channel_id = data.get("target_channel")  # "-1004361466102"
    target_group_id = data.get("target_group")      # "-1004387466129"
    
    # 提取六大评分
    p_photo = data.get("p_photo", 9)
    p_face = data.get("p_face", 9)
    p_body = data.get("p_body", 9)
    p_service = data.get("p_service", 9.5)
    p_item = data.get("p_item", 9.5)
    p_env = data.get("p_env", 9)

    stars = "⭐" * int(score // 2 if score > 5 else 1)
    
    # 构造推送给管理员看的消息（附带具体的六大项）
    review_text = (
        f"💞 <b>【桃花谷公榜 · 待审核车评】</b>\n\n"
        f"👤 <b>老师名字：</b> {teacher}\n"
        f"📊 <b>综合评分：</b> {score} 分 {stars}\n"
        f"📈 <b>细分维度：</b>\n"
        f" ├ 人照: {p_photo} | 颜值: {p_face} | 身材: {p_body}\n"
        f" └ 服务: {p_service} | 态度: {p_item} | 环境: {p_env}\n\n"
        f"📝 <b>体验评语：</b> {comment}\n\n"
        f"👤 <b>提交用户：</b> @{update.effective_user.username or '匿名'}\n"
    )
    
    # 将目的群组 ID 和核心信息绑定到按钮的回调中
    # 格式：pub_群组ID|老师名字|综合分
    callback_payload = f"pub_{target_group_id}|{teacher}|{score}"
    
    keyboard = [
        [
            InlineKeyboardButton("✅ 审核通过并发布", callback_data=callback_payload),
            InlineKeyboardButton("❌ 拒绝", callback_data="pub_reject")
        ]
    ]
    
    try:
        # 发送到对应的审核频道 (需要转成 int)
        await context.bot.send_message(
            chat_id=int(target_channel_id),
            text=review_text,
            parse_mode="HTML",
            reply_markup=InlineKeyboardMarkup(keyboard)
        )
        await update.message.reply_text("🥰 您的车评已提交至审核频道，通过后将广播至交流群！")
    except Exception as e:
        await update.message.reply_text(f"⚠️ 推送失败，请确保机器人已加入频道并设置为管理员。")

async def handle_audit_buttons(update: Update, context: ContextTypes.DEFAULT_TYPE):
    query = update.callback_query
    await query.answer()
    
    if query.data == "pub_reject":
        await query.edit_message_text(text=f"{query.message.text_html}\n\n❌ <b>结果：已被管理员拒绝。</b>", parse_mode="HTML")
        return
        
    if query.data.startswith("pub_"):
        # 分离参数
        payload = query.data.replace("pub_", "")
        target_group_id, teacher, score = payload.split("|")
        
        # 1. 盖章修改审核频道内的消息状态
        await query.edit_message_text(
            text=f"{query.message.text_html}\n\n✅ <b>结果：审核已通过，已同步投递至群组。</b>", 
            parse_mode="HTML"
        )
        
        # 2. 从原文本提取车评评语
        orig_text = query.message.text
        comment_part = "暂无评语"
        if "体验评语：" in orig_text:
            comment_part = orig_text.split("体验评语：")[1].split("提交用户：")[0].strip()
            
        # 3. 组装给公榜大群看的高级排版
        stars = "⭐" * int(int(score) // 2 if int(score) > 5 else 1)
        group_publish_text = (
            f"💞 <b>桃花谷公榜 · 真实车评发布</b> 💞\n"
            f"━━━━━━━━━━━━━━━━━━\n"
            f"👤 <b>【佳丽留名】</b> {teacher}\n"
            f"📊 <b>【综合评分】</b> {score} 分 {stars}\n"
            f"📝 <b>【真实车评】</b>\n"
            f"<i>{comment_part}</i>\n"
            f"━━━━━━━━━━━━━━━━━━\n"
            f"🔥 欢迎各位车友提交真实反馈！"
        )
        
        # 发送到目标同步群组
        try:
            await context.bot.send_message(
                chat_id=int(target_group_id),
                text=group_publish_text,
                parse_mode="HTML"
            )
        except Exception as e:
            print(f"发送到群组失败: {e}")
