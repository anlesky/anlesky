<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交车评公榜</title>
    <!-- 正确 Telegram WebApp SDK -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #f5f5f5);
            --text: var(--tg-theme-text-color, #222);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #999);
            --button-bg: var(--tg-theme-button-color, #FFB6C1);
            --button-text: var(--tg-theme-button-text-color, #fff);
            --border: var(--tg-theme-secondary-bg-color, #ddd);
        }
        * {
            box-sizing: border-box;
        }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            padding: 15px; 
            margin: 0;
            min-height: 100vh;
        }
        .card { 
            background: var(--secondary-bg); 
            padding: 18px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
        }
        .title { 
            font-size: 20px; 
            font-weight: bold; 
            margin-bottom: 20px; 
            text-align: center; 
            color: #ff69b4; 
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .form-item { 
            margin-bottom: 16px; 
        }
        .form-item.full-width {
            grid-column: 1 / -1;
        }
        label { 
            display: block; 
            margin-bottom: 6px; 
            font-size: 14px; 
            font-weight: 500; 
        }
        input, select, textarea { 
            width: 100%; 
            padding: 11px; 
            border: 1px solid var(--hint); 
            border-radius: 8px; 
            font-size: 14px; 
            background: var(--bg); 
            color: var(--text); 
            outline: none;
        }
        input::placeholder, textarea::placeholder {
            color: var(--hint);
        }
        button { 
            width: 100%; 
            padding: 13px; 
            background: var(--button-bg); 
            border: none; 
            color: var(--button-text); 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
            margin-top: 8px; 
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.85;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">💞 桃花谷公榜 · 写车评</div>

        <div class="form-grid">
            <div class="form-item full-width">
                <label>【老师名字】*</label>
                <input type="text" id="teacher_name" placeholder="请输入老师名字，如：琪琪" required>
            </div>

            <div class="form-item">
                <label>【人照评分】</label>
                <select id="p_photo">
                    <option value="10">10分</option>
                    <option value="9.5">9.5分</option>
                    <option value="9" selected>9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
            <div class="form-item">
                <label>【颜值评分】</label>
                <select id="p_face">
                    <option value="10">10分</option>
                    <option value="9.5">9.5分</option>
                    <option value="9" selected>9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
            <div class="form-item">
                <label>【身材评分】</label>
                <select id="p_body">
                    <option value="10">10分</option>
                    <option value="9.5">9.5分</option>
                    <option value="9" selected>9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
            <div class="form-item">
                <label>【服务评分】</label>
                <select id="p_service">
                    <option value="10">10分</option>
                    <option value="9.5" selected>9.5分</option>
                    <option value="9">9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
            <div class="form-item">
                <label>【态度评分】</label>
                <select id="p_item">
                    <option value="10">10分</option>
                    <option value="9.5" selected>9.5分</option>
                    <option value="9">9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
            <div class="form-item">
                <label>【环境评分】</label>
                <select id="p_env">
                    <option value="10">10分</option>
                    <option value="9.5">9.5分</option>
                    <option value="9" selected>9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
        </div>

        <div class="form-item">
            <label>综合总评分 (1-10分)*</label>
            <select id="score">
                <option value="10">⭐⭐⭐⭐⭐ 10分 (完美)</option>
                <option value="9" selected>⭐⭐⭐⭐ 9分 (优秀)</option>
                <option value="8">⭐⭐⭐ 8分 (良好)</option>
                <option value="7">⭐⭐ 7分 (普通)</option>
                <option value="6">⭐ 6分 (一般)</option>
                <option value="5">5分及以下 (较差)</option>
            </select>
        </div>

        <div class="form-grid">
            <div class="form-item">
                <label>📌 提交至频道审核</label>
                <select id="chan_select">
                    <option value="-1004361466102" selected>车评审核😍</option>
                </select>
            </div>
            <div class="form-item">
                <label>💬 同步发布至群组</label>
                <select id="group_select">
                    <option value="-1004387466129" selected>桃花谷（车评）</option>
                </select>
            </div>
        </div>

        <div class="form-item">
            <label>体验评语*</label>
            <textarea id="comment" rows="4" placeholder="请写下老师的服务态度、环境和您的真实体验反馈..."></textarea>
        </div>

        <button id="submitBtn" onclick="doSubmit()">提交审核</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const submitBtn = document.getElementById('submitBtn');

        // 🛠️ 核心必填：请在此处填入从 @BotFather 那里获得的机器人 Token 字符串
        const BOT_TOKEN = "8790393467:AAH4oEKDrT50ikiAjrGLcpb34Hlp-OOdlgU"; 

        tg.onEvent('themeChanged', () => {
            document.documentElement.style.setProperty('--bg', tg.themeParams.bg_color || '#f5f5f5');
            document.documentElement.style.setProperty('--text', tg.themeParams.text_color || '#222');
        });
        tg.expand();
        tg.MainButton.hide();

        async def function doSubmit() {
            const teacherName = document.getElementById('teacher_name').value.trim();
            const pPhoto = parseFloat(document.getElementById('p_photo').value);
            const pFace = parseFloat(document.getElementById('p_face').value);
            const pBody = parseFloat(document.getElementById('p_body').value);
            const pService = parseFloat(document.getElementById('p_service').value);
            const pItem = parseFloat(document.getElementById('p_item').value);
            const pEnv = parseFloat(document.getElementById('p_env').value);
            const totalScore = parseInt(document.getElementById('score').value);
            const comment = document.getElementById('comment').value.trim();

            const targetChannel = document.getElementById('chan_select').value;
            const targetGroup = document.getElementById('group_select').value;

            if (!teacherName) { tg.showAlert('请填写老师名字！'); return; }
            if (!comment) { tg.showAlert('请写下您的真实体验评语！'); return; }
            if (comment.length < 10) { tg.showAlert('体验评语太短，请至少输入10个字。'); return; }

            submitBtn.disabled = true;
            submitBtn.innerText = '正在发送至审核群...';

            // 1. 在前端直接组装好渲染漂亮的 HTML 排版文本
            const stars = "⭐".repeat(Math.max(1, Math.floor(totalScore / 2)));
            const userMarkup = tg.initDataUnsafe.user ? `@${tg.initDataUnsafe.user.username || ''} (${tg.initDataUnsafe.user.first_name || '匿名'})` : "快捷访问用户";
            
            const reviewHtmlText = `💞 <b>【桃花谷公榜 · 待审核车评】</b>\n\n` +
                                  `👤 <b>老师名字：</b> ${teacherName}\n` +
                                  `📊 <b>综合评分：</b> ${totalScore} 分 ${stars}\n` +
                                  `📈 <b>细分维度：</b>\n` +
                                  ` ├ 人照: ${pPhoto} | 颜值: ${pFace} | 身材: ${pBody}\n` +
                                  ` └ 服务: ${pService} | 态度: {pItem} | 环境: ${pEnv}\n\n` +
                                  `📝 <b>体验评语：</b> ${comment}\n\n` +
                                  `🗣️ <b>提交用户：</b> ${userMarkup}\n` +
请谨慎使用此类代码。⚙️ <b>同步目标群：</b> <code>${targetGroup}</code>;// 2. 利用纯前端 Fetch 异步请求，绕过服务器，直接轰炸 Telegram 官方 APIconst url = https://telegram.org{BOT_TOKEN}/sendMessage;try {const response = await fetch(url, {method: 'POST',headers: { 'Content-Type': 'application/json' },body: JSON.stringify({chat_id: targetChannel, // 直接投递到前端选中的审核频道 -1004361466102text: reviewHtmlText,parse_mode: 'HTML'})});const resData = await response.json();if (resData.ok) {tg.showAlert('🥰 车评已成功送达审核群，请等待管理员审核放行！', () => {tg.close(); // 成功后弹窗，用户点击确定后关闭网页});} else {throw new Error(resData.description || '未知API阻断');}} catch (error) {tg.showAlert('❌ 投递失败！原因：' + error.message);submitBtn.disabled = false;submitBtn.innerText = '提交审核';}}
