<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交车评公榜</title>
    <!-- 正确 Telegram WebApp SDK -->
    <script src="https://anlesky.github.io/anlesky"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #f5f5f5);
            --text: var(--tg-theme-text-color, #222);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #999);
            --button-bg: var(--tg-theme-button-color, #FFB6C1);
            --button-text: var(--tg-theme-button-text-color, #fff);
            --border: var(--tg-theme-secondary-bg-color, #ddd);
        }
        * {
            box-sizing: border-box;
        }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            padding: 15px; 
            margin: 0;
            min-height: 100vh;
        }
        .card { 
            background: var(--secondary-bg); 
            padding: 18px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
        }
        .title { 
            font-size: 20px; 
            font-weight: bold; 
            margin-bottom: 20px; 
            text-align: center; 
            color: #ff69b4; 
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .form-item { 
            margin-bottom: 16px; 
        }
        .form-item.full-width {
            grid-column: 1 / -1;
        }
        label { 
            display: block; 
            margin-bottom: 6px; 
            font-size: 14px; 
            font-weight: 500; 
        }
        input, select, textarea { 
            width: 100%; 
            padding: 11px; 
            border: 1px solid var(--hint); 
            border-radius: 8px; 
            font-size: 14px; 
            background: var(--bg); 
            color: var(--text); 
            outline: none;
        }
        input::placeholder, textarea::placeholder {
            color: var(--hint);
        }
        button { 
            width: 100%; 
            padding: 13px; 
            background: var(--button-bg); 
            border: none; 
            color: var(--button-text); 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
            margin-top: 8px; 
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.85;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">💞 桃花谷公榜 · 写车评</div>

        <div class="form-grid">
            <div class="form-item full-width">
                <label>【老师名字】*</label>
                <input type="text" id="teacher_name" placeholder="请输入老师名字" required>
            </div>

            <div class="form-item">
                <label>【人照评分】</label>
                <select id="p_photo">
                    <option value="10">10分</option>
                    <option value="9.5">9.5分</option>
                    <option value="9" selected>9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
            <div class="form-item">
                <label>【颜值评分】</label>
                <select id="p_face">
                    <option value="10">10分</option>
                    <option value="9.5">9.5分</option>
                    <option value="9" selected>9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
            <div class="form-item">
                <label>【身材评分】</label>
                <select id="p_body">
                    <option value="10">10分</option>
                    <option value="9.5">9.5分</option>
                    <option value="9" selected>9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
            <div class="form-item">
                <label>【服务评分】</label>
                <select id="p_service">
                    <option value="10">10分</option>
                    <option value="9.5" selected>9.5分</option>
                    <option value="9">9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
            <div class="form-item">
                <label>【态度评分】</label>
                <select id="p_item">
                    <option value="10">10分</option>
                    <option value="9.5" selected>9.5分</option>
                    <option value="9">9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
            <div class="form-item">
                <label>【环境评分】</label>
                <select id="p_env">
                    <option value="10">10分</option>
                    <option value="9.5">9.5分</option>
                    <option value="9" selected>9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
        </div>

        <div class="form-item">
            <label>综合总评分 (1-10分)*</label>
            <select id="score">
                <option value="10">⭐⭐⭐⭐⭐ 10分 (完美)</option>
                <option value="9" selected>⭐⭐⭐⭐ 9分 (优秀)</option>
                <option value="8">⭐⭐⭐ 8分 (良好)</option>
                <option value="7">⭐⭐ 7分 (普通)</option>
                <option value="6">⭐ 6分 (一般)</option>
                <option value="5">5分及以下 (较差)</option>
            </select>
        </div>

        <div class="form-grid">
            <div class="form-item">
                <label>📌 提交至频道审核</label>
                <select id="chan_select">
                    <option value="-1004361466102" selected>车评审核😍</option>
                </select>
            </div>
            <div class="form-item">
                <label>💬 同步发布至群组</label>
                <select id="group_select">
                    <option value="-1004387466129" selected>桃花谷（车评）</option>
                </select>
            </div>
        </div>

        <div class="form-item">
            <label>体验评语*</label>
            <textarea id="comment" rows="4" placeholder="请写下老师的服务态度、环境和您的真实体验反馈..."></textarea>
        </div>

        <button id="submitBtn" onclick="doSubmit()">提交审核</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const submitBtn = document.getElementById('submitBtn');

        // 🛠️ 您的真实 Bot Token
        const BOT_TOKEN = "8790393467:AAH4oEKDrT50ikiAjrGLcpb34Hlp-OOdlgU"; 

        tg.onEvent('themeChanged', () => {
            document.documentElement.style.setProperty('--bg', tg.themeParams.bg_color || '#f5f5f5');
            document.documentElement.style.setProperty('--text', tg.themeParams.text_color || '#222');
        });
        tg.expand();
        tg.MainButton.hide();

        // 💡 修复关键：修正了错误的 async 声明语法，并修正了文本中 p_item 的变量插值
        async function doSubmit() {
                    const tg = window.Telegram.WebApp;
        const submitBtn = document.getElementById('submitBtn');

        // 🛠️ 您的真实 Bot Token
        const BOT_TOKEN = "8790393467:AAH4oEKDrT50ikiAjrGLcpb34Hlp-OOdlgU"; 

        tg.onEvent('themeChanged', () => {
            document.documentElement.style.setProperty('--bg', tg.themeParams.bg_color || '#f5f5f5');
            document.documentElement.style.setProperty('--text', tg.themeParams.text_color || '#222');
        });
        tg.expand();
        tg.MainButton.hide();

        // 💡 修复并补齐的关键提交逻辑
        async function doSubmit() {
            // 1. 获取表单数据
            const teacherName = document.getElementById('teacher_name').value.trim();
            const pPhoto = parseFloat(document.getElementById('p_photo').value);
            const pFace = parseFloat(document.getElementById('p_face').value);
            const pBody = parseFloat(document.getElementById('p_body').value);
            const pService = parseFloat(document.getElementById('p_service').value);
            const pItem = parseFloat(document.getElementById('p_item').value); // 态度评分
            const pEnv = parseFloat(document.getElementById('p_env').value);
            const scoreSelect = document.getElementById('score');
            const scoreText = scoreSelect.options[scoreSelect.selectedIndex].text;
            const comment = document.getElementById('comment').value.trim();

            const chanId = document.getElementById('chan_select').value;
            const groupId = document.getElementById('group_select').value;

            // 2. 基础表单验证
            if (!teacherName) {
                tg.showAlert("请输入老师名字！");
                return;
            }
            if (!comment) {
                tg.showAlert("请填写体验评语！");
                return;
            }

            // 3. 禁用按钮防止重复提交
            submitBtn.disabled = true;
            submitBtn.innerText = "提交中...";

            // 4. 组装 Telegram 机器人消息文本 (支持 MarkdownV2 格式)
            // 注意：MarkdownV2 需要对特殊字符进行转义，此处使用纯文本或标准 HTML 模式更安全
            const messageText = `💬 *新车评提交审核* \n\n` +
                                `【老师名字】：${teacherName}\n` +
                                `【人照评分】：${pPhoto} 分\n` +
                                `【颜值评分】：${pFace} 分\n` +
                                `【身材评分】：${pBody} 分\n` +
                                `【服务评分】：${pService} 分\n` +
                                `【态度评分】：${pItem} 分\n` +
                                `【环境评分】：${pEnv} 分\n` +
                                `-------------------------\n` +
                                `【综合总评分】：${scoreText}\n\n` +
                                `【体验评语】：\n${comment}`;

            // 5. 定义发送至 Telegram API 的方法
            const sendTelegramMessage = async (chatId) => {
                const url = `https://telegram.org{BOT_TOKEN}/sendMessage`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: messageText,
                        parse_mode: 'Markdown' // 使用标准 Markdown
                    })
                });
                return response.json();
            };

            try {
                // 6. 并行发送至频道和群组
                const promises = [];
                if (chanId) promises.push(sendTelegramMessage(chanId));
                if (groupId) promises.push(sendTelegramMessage(groupId));

                const results = await Promise.all(promises);
                
                // 检查第一个请求是否成功
                if (results[0] && results[0].ok) {
                    tg.showAlert("🎉 提交成功，请等待频道审核！", () => {
                        tg.close(); // 提交成功后自动关闭 WebApp
                    });
                } else {
                    throw new Error(results[0]?.description || "发送失败");
                }
            } catch (error) {
                console.error(error);
                tg.showAlert("❌ 提交失败: " + error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "提交审核";
            }
        }
    </script>
</body>
</html>
