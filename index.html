<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交车评公榜</title>
    <!-- 📌 正确加载 Telegram WebApp SDK -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #f5f5f5);
            --text: var(--tg-theme-text-color, #222);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #999);
            --button-bg: var(--tg-theme-button-color, #FFB6C1);
            --button-text: var(--tg-theme-button-text-color, #fff);
            --border: var(--tg-theme-secondary-bg-color, #ddd);
        }
        * { box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            padding: 15px; 
            margin: 0;
            min-height: 100vh;
        }
        .card { 
            background: var(--secondary-bg); 
            padding: 18px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
        }
        .title { 
            font-size: 20px; 
            font-weight: bold; 
            margin-bottom: 20px; 
            text-align: center; 
            color: #ff69b4; 
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .form-item { margin-bottom: 16px; }
        .form-item.full-width { grid-column: 1 / -1; }
        label { 
            display: block; 
            margin-bottom: 6px; 
            font-size: 14px; 
            font-weight: 500; 
        }
        input, select, textarea { 
            width: 100%; 
            padding: 11px; 
            border: 1px solid var(--hint); 
            border-radius: 8px; 
            font-size: 14px; 
            background: var(--bg); 
            color: var(--text); 
            outline: none;
        }
        input::placeholder, textarea::placeholder { color: var(--hint); }
        button { 
            width: 100%; 
            padding: 13px; 
            background: var(--button-bg); 
            border: none; 
            color: var(--button-text); 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
            margin-top: 8px; 
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.85; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">💞 桃花谷公榜 · 写车评</div>

        <div class="form-grid">
            <div class="form-item full-width">
                <label>【老师名字】*</label>
                <input type="text" id="teacher_name" placeholder="请输入老师名字，如：琪琪" required>
            </div>

            <div class="form-item">
                <label>【人照评分】</label>
                <select id="p_photo">
                    <option value="10">10分</option>
                    <option value="9.5">9.5分</option>
                    <option value="9" selected>9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
            <div class="form-item">
                <label>【颜值评分】</label>
                <select id="p_face">
                    <option value="10">10分</option>
                    <option value="9.5">9.5分</option>
                    <option value="9" selected>9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
            <div class="form-item">
                <label>【身材评分】</label>
                <select id="p_body">
                    <option value="10">10分</option>
                    <option value="9.5">9.5分</option>
                    <option value="9" selected>9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
            <div class="form-item">
                <label>【服务评分】</label>
                <select id="p_service">
                    <option value="10">10分</option>
                    <option value="9.5" selected>9.5分</option>
                    <option value="9">9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
            <div class="form-item">
                <label>【态度评分】</label>
                <select id="p_item">
                    <option value="10">10分</option>
                    <option value="9.5" selected>9.5分</option>
                    <option value="9">9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
            <div class="form-item">
                <label>【环境评分】</label>
                <select id="p_env">
                    <option value="10">10分</option>
                    <option value="9.5">9.5分</option>
                    <option value="9" selected>9分</option>
                    <option value="8">8分</option>
                    <option value="7">7分</option>
                    <option value="6">6分</option>
                </select>
            </div>
        </div>

        <div class="form-item">
            <label>综合总评分 (1-10分)*</label>
            <select id="score">
                <option value="10">⭐⭐⭐⭐⭐ 10分 (完美)</option>
                <option value="9" selected>⭐⭐⭐⭐ 9分 (优秀)</option>
                <option value="8">⭐⭐⭐ 8分 (良好)</option>
                <option value="7">⭐⭐ 7分 (普通)</option>
                <option value="6">⭐ 6分 (一般)</option>
                <option value="5">5分及以下 (较差)</option>
            </select>
        </div>

        <div class="form-grid">
            <div class="form-item">
                <label>📌 提交至频道审核</label>
                <select id="chan_select">
                    <option value="-1004361466102" selected>车评审核😍</option>
                </select>
            </div>
            <div class="form-item">
                <label>💬 同步发布至群组</label>
                <select id="group_select">
                    <option value="-1004387466129" selected>桃花谷（车评）</option>
                </select>
            </div>
        </div>

        <div class="form-item">
            <label>体验评语*</label>
            <textarea id="comment" rows="4" placeholder="请写下老师的服务态度、环境和您的真实体验反馈..."></textarea>
        </div>

        <button id="submitBtn">提交审核</button>
    </div>

    <script>
        // 配置专区
        const BOT_TOKEN = "8790393467:AAH4oEKDrT50ikiAjrGLcpb34Hlp-OOdlgU"; 
        const submitBtn = document.getElementById('submitBtn');

        // 安全尝试读取 TG 环境
        let tg = null;
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.expand();
            if (tg.MainButton) tg.MainButton.hide();
            
            // 颜色主题同步
            tg.onEvent('themeChanged', () => {
                document.documentElement.style.setProperty('--bg', tg.themeParams.bg_color || '#f5f5f5');
                document.documentElement.style.setProperty('--text', tg.themeParams.text_color || '#222');
            });
        }

        // 绑定按钮，利用最底层原生的方式，拦截任何不工作的问题
        submitBtn.onclick = async function() {
            try {
                // 环境兜底检查机制
                if (!window.Telegram || !window.Telegram.WebApp) {
                    alert('⚠️ 环境未就绪！\n本页面为 Telegram 专用 WebApp，请复制此网页链接发送给任意 TG 好友，并在 Telegram 聊天框内点击打开。');
                    return;
                }
                await processForm();
            } catch (err) {
                alert('🚨 运行时崩溃: ' + err.message);
            }
        };

        async function processForm() {
            const teacherName = document.getElementById('teacher_name').value.trim();
            const pPhoto = parseFloat(document.getElementById('p_photo').value);
            const pFace = parseFloat(document.getElementById('p_face').value);
            const pBody = parseFloat(document.getElementById('p_body').value);
            const pService = parseFloat(document.getElementById('p_service').value);
            const pItem = parseFloat(document.getElementById('p_item').value);
            const pEnv = parseFloat(document.getElementById('p_env').value);
            const totalScore = parseInt(document.getElementById('score').value);
            const comment = document.getElementById('comment').value.trim();

            const targetChannel = document.getElementById('chan_select').value;
            const targetGroup = document.getElementById('group_select').value;

            // 基础校验
            if (!teacherName) { alert('请输入老师名字！'); return; }
            if (!comment) { alert('请输入体验评语！'); return; }
            if (comment.length < 10) { alert('体验评语太短，请至少输入10个字！'); return; }

            // 按钮防连击状态锁定
            submitBtn.disabled = true;
            submitBtn.innerText = '发送中，请稍后...';

            // 获取提交人身份快照
            let userMarkup = "快捷访问用户";
            if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                const user = window.Telegram.WebApp.initDataUnsafe.user;
                userMarkup = user.username ? `@${user.username}` : `${user.first_name || '车友'} (ID: <code>${user.id}</code>)`;
            }

请谨慎使用此类代码。const stars = "⭐".repeat(Math.max(1, Math.floor(totalScore / 2)));// 完美无碎字符 HTML 拼接const reviewHtmlText = 💞 <b>【桃花谷公榜 · 待审核车评】</b>\n\n +👤 <b>老师名字：</b> ${teacherName}\n +📊 <b>综合评分：</b> ${totalScore} 分 ${stars}\n +📈 <b>细分维度：</b>\n + ├ 人照: ${pPhoto} | 颜值: ${pFace} | 身材: ${pBody}\n + └ 服务: ${pService} | 态度: ${pItem} | 环境: ${pEnv}\n\n +📝 <b>体验评语：</b> ${comment}\n\n +🗣️ <b>提交用户：</b> ${userMarkup}\n +⚙️ <b>同步目标群：</b> <code>${targetGroup}</code>;// 调用 TG Bot 核心发送 APIconst apiUrl = https://telegram.org{BOT_TOKEN}/sendMessage;try {const response = await fetch(apiUrl, {method: 'POST',headers: { 'Content-Type': 'application/json' },body: JSON.stringify({chat_id: targetChannel,text: reviewHtmlText,parse_mode: 'HTML'})});const resData = await response.json();if (resData.ok) {if (window.Telegram.WebApp.showAlert) {window.Telegram.WebApp.showAlert('🥰 车评已成功送达审核群！', () => {window.Telegram.WebApp.close();});} else {alert('🥰 车评已成功送达审核群！');}} else {// 如果机器人没在群里，这里会100%拦截并明确解释原因alert('❌ 投递被 Telegram 拦截！\n\n原因: ' + resData.description + '\n\n💡 解决办法：请把您的机器人拉进【车评审核😍】群组，并设置为管理员（开启发送消息权限）！');submitBtn.disabled = false;submitBtn.innerText = '提交审核';}} catch (netError) {alert('❌ 网络请求失败，请检查网络或HTTPS证书设置: ' + netError.message);submitBtn.disabled = false;submitBtn.innerText = '提交审核';}}
