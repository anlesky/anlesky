<script>
        // 初始化TG WebApp
        const tg = window.Telegram.WebApp;
        const submitBtn = document.getElementById('submitBtn');

        // 适配Telegram系统主题颜色
        function applyTheme() {
            if (tg.themeParams.bg_color) {
                document.documentElement.style.setProperty('--bg', tg.themeParams.bg_color);
            }
            if (tg.themeParams.text_color) {
                document.documentElement.style.setProperty('--text', tg.themeParams.text_color);
            }
            if (tg.themeParams.secondary_bg_color) {
                document.documentElement.style.setProperty('--secondary-bg', tg.themeParams.secondary_bg_color);
            }
            if (tg.themeParams.hint_color) {
                document.documentElement.style.setProperty('--hint', tg.themeParams.hint_color);
            }
            if (tg.themeParams.button_color) {
                document.documentElement.style.setProperty('--button-bg', tg.themeParams.button_color);
            }
            if (tg.themeParams.button_text_color) {
                document.documentElement.style.setProperty('--button-text', tg.themeParams.button_text_color);
            }
        }

        // 初始化和事件监听
        tg.onEvent('themeChanged', applyTheme);
        applyTheme();
        tg.expand();
        tg.MainButton.hide();

        function doSubmit() {
            // 获取所有表单值
            const teacherName = document.getElementById('teacher_name').value.trim();
            const pPhoto = parseFloat(document.getElementById('p_photo').value);
            const pFace = parseFloat(document.getElementById('p_face').value);
            const pBody = parseFloat(document.getElementById('p_body').value);
            const pService = parseFloat(document.getElementById('p_service').value);
            const pItem = parseFloat(document.getElementById('p_item').value);
            const pEnv = parseFloat(document.getElementById('p_env').value);
            const totalScore = parseInt(document.getElementById('score').value);
            const comment = document.getElementById('comment').value.trim();

            // 完整表单校验
            if (!teacherName) {
                tg.showAlert('请填写老师名字！');
                return;
            }
            if (!comment) {
                tg.showAlert('请填写您的体验评语！');
                return;
            }
            if (comment.length < 10) {
                tg.showAlert('评语太短了，请多写两句真实反馈吧（至少10个字）！');
                return;
            }

            // 按钮状态反馈，防止重复点击
            submitBtn.disabled = true;
            submitBtn.innerText = '正在提交...';

            // 构建发回给 Bot 的 JSON 数据
            const resultData = {
                action: "submit_review",
                teacher_name: teacherName,
                scores: {
                    photo: pPhoto,
                    face: pFace,
                    body: pBody,
                    service: pService,
                    attitude: pItem,
                    env: pEnv
                },
                total_score: totalScore,
                comment: comment
            };

            try {
                // 将数据转换为字符串，通过 WebApp 接口发回给 Telegram 客户端
                // 注意：tg.sendData 仅在通过 KeyboardButton 打开的 WebApp 中有效
                tg.sendData(JSON.stringify(resultData));
                
                // 发送数据后，通知 WebApp 优雅关闭
                tg.close();
            } catch (error) {
                tg.showAlert('提交失败，请在 Telegram 聊天内重试。');
                submitBtn.disabled = false;
                submitBtn.innerText = '提交审核';
            }
        }
    </script>
